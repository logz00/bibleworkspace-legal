<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibleStudy</title>
<style>
  :root { --fg:#1a1a2e; --muted:#5a5a72; --bg:#ffffff; --accent:#4A90D9; --border:#e3e3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8f0; --muted:#9999bb; --bg:#14142a; --accent:#7aa9e0; --border:#2a2a4e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:40px 20px; background:var(--bg); color:var(--fg);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; width:100%; text-align:center; }
  h1 { font-size:2.1rem; margin:0 0 8px; letter-spacing:-.02em; }
  p.tag { color:var(--muted); margin:0 0 32px; }
  .links { display:flex; flex-direction:column; gap:10px; }
  a.link { display:block; padding:15px; border:1px solid var(--border); border-radius:12px;
           text-decoration:none; color:var(--fg); font-weight:600; }
  a.link:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:32px; color:var(--muted); font-size:.88rem; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>BibleStudy</h1>
  <p class="tag">Your personal Bible study workspace</p>
  <div class="links">
    <a class="link" href="./privacy.html">Privacy Policy</a>
    <a class="link" href="./terms.html">Terms of Service</a>
  </div>
  <footer>Support: <a href="mailto:bibleworkspace@gmail.com">bibleworkspace@gmail.com</a></footer>
</main>
</body>
</html>
